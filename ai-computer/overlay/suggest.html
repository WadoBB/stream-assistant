<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stream Assistant Car Suggester</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  /* Top-right, so it doesn't collide with the Car Card (top-left), which
     fires on every car change while you browse the car-select screen. */
  #suggest {
    position: fixed;
    top: 6%;
    right: 3%;
    width: 440px;
    transform: translateX(110%);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
    background: linear-gradient(135deg, #2a1b3a, #12283a);
    border: 2px solid #ffb547;
    border-radius: 14px;
    box-shadow: 0 0 24px rgba(255, 181, 71, 0.45), 0 8px 24px rgba(0,0,0,0.5);
    padding: 14px 18px 12px;
    color: #fff;
  }

  #suggest.show {
    opacity: 1;
    transform: translateX(0);
  }

  #sg-title {
    font-size: 22px;
    font-weight: 800;
    color: #ffb547;
    text-shadow: 0 0 10px rgba(255, 181, 71, 0.6);
    letter-spacing: 0.5px;
  }

  #sg-subtitle {
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 8px;
  }

  #sg-timer {
    height: 4px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  #sg-timer-fill {
    height: 100%;
    width: 100%;
    background: #ffb547;
    transform-origin: left center;
  }

  ol {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 3px 0;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  li:first-child { border-top: none; }

  .rank {
    width: 22px;
    flex-shrink: 0;
    text-align: right;
    font-weight: 800;
    opacity: 0.6;
  }

  .body { min-width: 0; flex: 1; }

  .name {
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meta {
    font-size: 12px;
    opacity: 0.8;
  }

  /* Top 3 big - under time pressure you'll pick from the first few anyway. */
  li.top .name { font-size: 19px; color: #ffe2b0; }
  li.top .rank { font-size: 19px; opacity: 0.9; color: #ffb547; }
  li.top .meta { font-size: 13px; }
  li.rest .name { font-size: 14px; }
  li.rest .rank { font-size: 14px; }

  /* ?fit=1 (used by /monitor): pinned to the frame's top-left and scaled
     down by fitToFrame() so the whole list shows in a short panel. */
  body.fit #suggest {
    top: 8px;
    right: auto;
    left: 8px;
    transform: none;
    transition: opacity 0.4s ease;
  }

  #sg-empty {
    font-size: 14px;
    opacity: 0.75;
    font-style: italic;
    padding: 4px 0;
  }
</style>
</head>
<body>

<div id="suggest">
  <div id="sg-title"></div>
  <div id="sg-subtitle"></div>
  <div id="sg-timer"><div id="sg-timer-fill"></div></div>
  <ol id="sg-list"></ol>
  <div id="sg-empty" hidden></div>
</div>

<script>
  // Same Server-Sent Events + watchdog + ack + self-refresh setup as
  // car_card.html and index.html - see those pages and controller.py's
  // _sse_stream() for why each piece exists. Only the display differs.
  const MAX_AGE_MS = 60 * 1000;
  const CLOCK_SKEW_MS = 5000;
  // Display time comes with each event (config.py's SUGGEST_SHOW_SECONDS,
  // read fresh by suggest_cars.py every press) so it can be tuned to the
  // car-select window without touching this page or the other overlays.
  const DEFAULT_SHOW_S = 25;
  const TOP_N = 3;
  // /monitor loads this page with ?fit=1 - see fitToFrame().
  const FIT = new URLSearchParams(location.search).has('fit');
  if (FIT) document.body.classList.add('fit');

  // The OBS copy sits on a full-size canvas, but /monitor gives this page a
  // short panel under the two cards, where a 10-car list gets cut off.
  // Shrink the whole panel (never enlarge) to fit whatever space it has.
  function fitToFrame() {
    if (!FIT) return;
    const panel = document.getElementById('suggest');
    panel.style.zoom = 1;
    const scale = Math.min(1,
      (window.innerHeight - 16) / panel.offsetHeight,
      (window.innerWidth - 16) / panel.offsetWidth);
    panel.style.zoom = Math.max(0.3, scale);
  }
  window.addEventListener('resize', fitToFrame);

  let lastTimestamp = null;
  let hideTimer = null;

  const IN_OBS = typeof window.obsstudio !== 'undefined';
  function sendAck(ts, shown, ageMs) {
    const q = new URLSearchParams({
      page: 'suggest', ts, obs: IN_OBS ? '1' : '0',
      shown: shown ? '1' : '0', age: String(Math.round(ageMs)),
    });
    fetch('/overlay/ack?' + q).catch(() => {});
  }
  function ackAfterPaint(ts, ageMs) {
    requestAnimationFrame(() => requestAnimationFrame(() => sendAck(ts, true, ageMs)));
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function carMeta(car, unraced) {
    const bits = [];
    if (!unraced) {
      const pct = car.win_rate === null || car.win_rate === undefined
        ? '' : ` · ${(car.win_rate * 100).toFixed(0)}%`;
      bits.push(`${car.wins}/${car.races} wins${pct}`);
      if (car.records) bits.push(`🏆 ${car.records}`);
    }
    if (car.tuner) bits.push(`Tune: ${car.tuner}`);
    if (car.tune) bits.push(car.tune);
    return bits.join(' · ');
  }

  function showList(event, ageMs) {
    const unraced = event.mode === 'unraced';
    const cars = event.cars || [];
    document.getElementById('sg-title').textContent =
      `${event.class} ${String(event.type || '').toUpperCase()} · ` +
      (unraced ? 'UNRACED' : `TOP ${cars.length}`);
    document.getElementById('sg-subtitle').textContent =
      (event.test ? 'TEST · ' : '') +
      (unraced ? `${event.total} owned, not yet raced` : `ranked from ${event.total} raced cars`) +
      (unraced ? '' : ' · Meta & Not-favorite excluded');

    const list = document.getElementById('sg-list');
    list.replaceChildren();
    cars.forEach((car, i) => {
      const li = el('li', i < TOP_N ? 'top' : 'rest');
      li.appendChild(el('span', 'rank', String(i + 1)));
      const body = el('div', 'body');
      body.appendChild(el('div', 'name', car.name || car.car_name));
      const meta = carMeta(car, unraced);
      if (meta) body.appendChild(el('div', 'meta', meta));
      li.appendChild(body);
      list.appendChild(li);
    });

    const empty = document.getElementById('sg-empty');
    empty.hidden = cars.length > 0;
    empty.textContent = unraced
      ? `No unraced ${event.class} ${event.type} cars on the Cars tab.`
      : `No raced ${event.class} ${event.type} cars yet (Meta/Not-favorite excluded).`;

    // Time left counts from when the button was pressed, not when this page
    // got it, so a slow push doesn't keep the list up into the race.
    const showMs = Math.max(1000, (event.show_seconds || DEFAULT_SHOW_S) * 1000 - Math.max(0, ageMs));
    const fill = document.getElementById('sg-timer-fill');
    fill.style.transition = 'none';
    fill.style.transform = 'scaleX(1)';
    void fill.offsetWidth;   // restart the countdown bar from full
    fill.style.transition = `transform ${showMs}ms linear`;
    fill.style.transform = 'scaleX(0)';

    const panel = document.getElementById('suggest');
    fitToFrame();
    panel.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => panel.classList.remove('show'), showMs);
  }

  const WATCHDOG_MS = 8000;
  let lastActivityAt = Date.now();
  let source = null;

  function connect() {
    if (source) source.close();
    source = new EventSource('/suggest/stream');
    lastActivityAt = Date.now();

    source.addEventListener('ping', () => { lastActivityAt = Date.now(); });

    source.onmessage = (msg) => {
      lastActivityAt = Date.now();
      let event;
      try {
        event = JSON.parse(msg.data);
      } catch (e) {
        return;
      }
      // Dedup on timestamp - pressing the same button twice is a real
      // re-show; a reconnect's echo of the last event is not.
      if (event && event.timestamp && event.timestamp !== lastTimestamp) {
        const ageMs = Date.now() - new Date(event.timestamp).getTime();
        lastTimestamp = event.timestamp;
        const showS = event.show_seconds || DEFAULT_SHOW_S;
        // Past its own display window it's stale - don't flash an old list
        // after a Browser Source reload.
        if (ageMs >= -CLOCK_SKEW_MS && ageMs <= Math.min(MAX_AGE_MS, showS * 1000)) {
          showList(event, ageMs);
          ackAfterPaint(event.timestamp, ageMs);
        } else {
          sendAck(event.timestamp, false, ageMs);
        }
      }
    };
    source.onerror = () => {};
  }

  connect();
  setInterval(() => {
    const stale = Date.now() - lastActivityAt > WATCHDOG_MS;
    if (stale && (!source || source.readyState !== EventSource.CONNECTING)) {
      connect();
    }
  }, 3000);

  const SELF_REFRESH_MS = 10 * 60 * 1000;
  function selfRefresh() {
    if (document.getElementById('suggest').classList.contains('show')) {
      setTimeout(selfRefresh, 2000);
    } else {
      location.reload();
    }
  }
  setTimeout(selfRefresh, SELF_REFRESH_MS);
</script>

</body>
</html>
