<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stream Assistant Monitor</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0d14;
    overflow: hidden;
  }

  #stack {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }

  iframe {
    width: 100%;
    border: none;
    border-bottom: 1px solid #222;
  }

  /* The record alert and Car Card are short fixed-size cards; the
     suggester list is much taller, so it gets whatever height is left and
     its ?fit=1 mode shrinks it to fit that. */
  iframe.card { flex: 0 0 180px; }
  iframe.list { flex: 1 1 auto; min-height: 0; }

  /* While the suggester list is up, it takes over the whole window so it
     stays readable - the cards still fire on stream, just not here for
     those few seconds. Toggled by the message listener below. */
  body.suggesting iframe.card { flex-basis: 0; min-height: 0; height: 0; border-bottom: none; }
</style>
</head>
<body>

<!--
  Personal monitoring view, not an OBS source - the overlay pages still
  render with their own transparent backgrounds (unchanged, since OBS
  Browser Sources point at /overlay and /car_card directly, not here), this
  page just gives them a dark background so they're visible on a plain
  monitor. Stacked top/bottom for a narrow vertical display like the
  Xeneon Edge run in portrait - see gaming-pc/open_stream_monitor.bat.
-->
<!--
  ?muted=1 silences both pages here - this window plays on the AI PC's own
  speakers, and its sound was reaching the stream a second time on top of
  the (volume-controlled) OBS copies. OBS's Browser Sources load the pages
  without the flag, so their sound is unaffected.
-->
<div id="stack">
  <iframe class="card" src="/overlay?muted=1"></iframe>
  <iframe class="card" src="/car_card?muted=1"></iframe>
  <iframe class="list" src="/suggest?fit=1"></iframe>
</div>

<script>
  // suggest.html (loaded with ?fit=1) posts {suggest: 'show'|'hide'} when
  // its list appears and disappears.
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || !e.data || !e.data.suggest) return;
    document.body.classList.toggle('suggesting', e.data.suggest === 'show');
  });
</script>

</body>
</html>
