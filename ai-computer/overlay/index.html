<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stream Assistant Overlay</title>
<style>
  /* Transparent so OBS Browser Source shows only the alert box, not a background. */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  #record-alert {
    position: fixed;
    left: 50%;
    bottom: 8%;
    transform: translate(-50%, 40px);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
    background: linear-gradient(135deg, #1b1f3a, #3a1b5a);
    border: 2px solid #ffd447;
    border-radius: 14px;
    box-shadow: 0 0 30px rgba(255, 212, 71, 0.6), 0 8px 24px rgba(0,0,0,0.5);
    padding: 18px 36px;
    text-align: center;
    color: #fff;
    min-width: 420px;
  }

  #record-alert.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  #record-alert .headline {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #ffd447;
    text-shadow: 0 0 12px rgba(255, 212, 71, 0.8);
    margin-bottom: 4px;
  }

  #record-alert .detail-line {
    font-size: 18px;
    font-weight: 600;
  }

  #record-alert .sub-line {
    font-size: 14px;
    opacity: 0.85;
    margin-top: 2px;
  }
</style>
</head>
<body>

<div id="record-alert">
  <div class="headline">🏆 NEW RECORD!</div>
  <div class="detail-line" id="ra-main"></div>
  <div class="sub-line" id="ra-sub"></div>
</div>

<audio id="cheer-sound" src="/overlay/cheer.mp3" preload="auto"></audio>

<script>
  // Listens for the latest record event via Server-Sent Events (server
  // pushes the moment overlay_state.json changes - see controller.py's
  // _sse_stream()) instead of the page repeatedly asking. Only flashes an
  // event once per page load per race_id, and only if it's recent - guards
  // against replaying an old record if the Browser Source reloads long after
  // the event happened (e.g. OBS restart mid-stream). EventSource itself
  // handles reconnecting automatically if the connection ever drops (e.g. a
  // controller.py restart) - no manual retry loop needed here.
  const MAX_AGE_MS = 60 * 1000;
  const SHOW_MS = 7000;

  let lastRaceId = null;
  let hideTimer = null;

  function showAlert(event) {
    document.getElementById('ra-main').textContent =
      `${event.car} — ${event.track} (${event.class})`;
    document.getElementById('ra-sub').textContent = event.previous_time
      ? `${event.time}  (previous best: ${event.previous_time})`
      : `${event.time}  (first time on record)`;

    const el = document.getElementById('record-alert');
    el.classList.add('show');

    // OBS Browser Sources generally allow audio autoplay without a prior
    // user gesture (that's how every existing alert-box overlay relies on
    // sound working), but .catch() here so a browser that DOES block it
    // just skips the sound silently instead of throwing.
    const sound = document.getElementById('cheer-sound');
    sound.currentTime = 0;
    sound.play().catch(() => {});

    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => el.classList.remove('show'), SHOW_MS);
  }

  // Watchdog: a long-lived EventSource connection was observed going quiet
  // without the browser's own reconnection logic reliably catching it - the
  // server-side push was confirmed working even then, so the connection
  // itself was stuck, not the data. lastActivityAt is updated on every real
  // event AND every "ping" (a named server heartbeat, sent every ~1s - see
  // controller.py's _sse_stream()); if too long passes with neither, force a
  // fresh connection instead of waiting on a manual Browser Source refresh.
  const WATCHDOG_MS = 8000;
  let lastActivityAt = Date.now();
  let source = null;

  function connect() {
    if (source) source.close();
    source = new EventSource('/overlay/stream');
    lastActivityAt = Date.now();

    source.addEventListener('ping', () => { lastActivityAt = Date.now(); });

    source.onmessage = (msg) => {
      lastActivityAt = Date.now();
      let event;
      try {
        event = JSON.parse(msg.data);
      } catch (e) {
        return;
      }

      if (event && event.race_id && event.race_id !== lastRaceId) {
        const ageMs = Date.now() - new Date(event.timestamp).getTime();
        lastRaceId = event.race_id;   // mark seen regardless of age
        if (ageMs >= 0 && ageMs <= MAX_AGE_MS) {
          showAlert(event);
        }
      }
    };
    // onerror fires on a dropped connection; EventSource reconnects on its
    // own in most cases, and the watchdog below catches the rest.
    source.onerror = () => {};
  }

  connect();
  setInterval(() => {
    // Only force a fresh connection if the existing one is genuinely stuck
    // OPEN-but-silent, or fully CLOSED. If it's CONNECTING, the browser's
    // own native retry is already in flight - confirmed via a real
    // controller.py restart that a slow-to-reconnect attempt (Windows can
    // take a bit to release/rebind the port) alternated ERR_ABORTED with
    // ERR_CONNECTION_TIMED_OUT for a long stretch before finally
    // succeeding, because this watchdog was calling connect() (which
    // closes the in-flight EventSource) every ~8-11s regardless of its
    // state - repeatedly cancelling a connection attempt that may have
    // been about to succeed, and restarting the wait from zero each time.
    // Leaving a CONNECTING source alone lets the browser's own retry loop
    // run uninterrupted instead of fighting it.
    const stale = Date.now() - lastActivityAt > WATCHDOG_MS;
    if (stale && (!source || source.readyState !== EventSource.CONNECTING)) {
      connect();
    }
  }, 3000);
</script>

</body>
</html>
